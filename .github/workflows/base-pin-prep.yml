name: Base Image Pin Prep

on:
  push:
    branches:
      - scratch/base-pin-prep

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout scratch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pin production Debian builder and runtime bases
        run: python3 scripts/prepare-base-pin.py

      - name: Regenerate Dockerfiles from canonical templates
        run: make -C docker

      - name: Validate generated pin diff
        run: |
          git diff --check
          git diff -- docker/DockerSettings.yaml docker/Dockerfile.debian docker/Dockerfile.alpine
          grep -F 'rust:1.97.1-slim-trixie@sha256:8e8cf8f7fd54a2d23d5a743b3a03f56e26b6c774276c33fa0595111704ebb15c' docker/Dockerfile.debian
          grep -F 'debian:trixie-slim@sha256:3a39a0592364683e6bab97937b72cad5a8fa6dcbbee90edb3bb48c7f8e94f258' docker/Dockerfile.debian

      - name: Commit generated base-image pins
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docker/DockerSettings.yaml docker/Dockerfile.debian docker/Dockerfile.alpine
          git diff --cached --quiet && { echo 'No base-image pin changes produced.' >&2; exit 1; }
          git commit -m 'Pin production Debian base image digests'
          git push origin HEAD:scratch/base-pin-prep
