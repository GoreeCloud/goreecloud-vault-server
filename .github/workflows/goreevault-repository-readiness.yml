name: GoreeVault Repository Readiness

on:
  pull_request:
    paths:
      - '.github/CODEOWNERS'
      - '.github/workflows/goreevault-repository-readiness.yml'
      - 'README.md'
      - 'GOREVAULT.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'deploy/**'
      - 'docs/**'
      - 'scripts/validate-repository-readiness.py'
      - 'scripts/validate-stable-evidence.py'

permissions:
  contents: read

jobs:
  validate:
    name: Validate GoreeVault repository contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact pull-request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Python syntax
        run: |
          python3 -m py_compile \
            scripts/validate-repository-readiness.py \
            scripts/validate-stable-evidence.py

      - name: Validate repository readiness
        run: python3 scripts/validate-repository-readiness.py
