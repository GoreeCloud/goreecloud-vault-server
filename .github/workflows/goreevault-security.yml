name: GoreeVault Security Scan

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'
  schedule:
    - cron: '37 10 * * *'

permissions:
  contents: read

concurrency:
  group: goreevault-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy source and image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout GoreeVault
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rehearse reverse-proxy-only Rocket build
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("Cargo.toml")
          text = path.read_text()
          old = 'rocket = { version = "0.5.1", default-features = false, features = ["json", "tls"] }'
          new = 'rocket = { version = "0.5.1", default-features = false, features = ["json"] }'
          if text.count(old) != 1:
              raise SystemExit("expected exactly one Rocket TLS dependency declaration")
          path.write_text(text.replace(old, new))
          PY

          cargo check --features postgresql

          if cargo tree -i rustls-webpki@0.101.7; then
            echo '::error title=Legacy Rocket TLS chain::rustls-webpki 0.101.7 is still reachable after removing Rocket TLS.'
            exit 1
          fi

          echo 'Legacy Rocket TLS chain is absent after removing Rocket TLS.'
          echo '### Reverse-proxy-only Rocket dependency delta' >> "${GITHUB_STEP_SUMMARY}"
          echo '```diff' >> "${GITHUB_STEP_SUMMARY}"
          git diff -- Cargo.toml Cargo.lock >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"

      - name: Scan GoreeVault repository
        id: trivy_repo
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: docker.io/aquasec/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: docker.io/aquasec/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1
        with:
          scan-type: repo
          scan-ref: .
          scanners: vuln
          ignore-unfixed: true
          format: sarif
          output: goreevault-trivy-repository.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: '1'

      - name: Upload repository Trivy results
        if: >-
          ${{ always() && hashFiles('goreevault-trivy-repository.sarif') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: goreevault-trivy-repository.sarif
          category: goreevault-trivy-repository

      - name: Show blocking repository findings
        if: always()
        run: |
          trivy repo \
            --scanners vuln \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --format table \
            . || true

      - name: Build GoreeVault PostgreSQL image for security scan
        run: |
          docker build \
            --file docker/Dockerfile.debian \
            --build-arg DB=postgresql \
            --tag "goreevault-security:${GITHUB_SHA}" \
            .

      - name: Scan built GoreeVault image
        id: trivy_image
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: docker.io/aquasec/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: docker.io/aquasec/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1
        with:
          scan-type: image
          image-ref: goreevault-security:${{ github.sha }}
          scanners: vuln
          skip-setup-trivy: true
          ignore-unfixed: true
          vuln-type: os,library
          format: sarif
          output: goreevault-trivy-image.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: '1'

      - name: Upload image Trivy results
        if: >-
          ${{ always() && hashFiles('goreevault-trivy-image.sarif') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: goreevault-trivy-image.sarif
          category: goreevault-trivy-image

      - name: Show blocking image findings
        if: always()
        run: |
          trivy image \
            --scanners vuln \
            --ignore-unfixed \
            --pkg-types os,library \
            --severity HIGH,CRITICAL \
            --format table \
            "goreevault-security:${GITHUB_SHA}" || true

      - name: Report blocking Trivy findings
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          report_sarif() {
            local file="$1"
            local surface="$2"

            if [[ ! -s "${file}" ]]; then
              echo "::error title=Trivy ${surface} scan::Expected SARIF output ${file} was not produced."
              return
            fi

            local count
            count="$(jq '[.runs[]?.results[]?] | length' "${file}")"
            {
              echo "### Trivy ${surface} scan"
              echo "- Blocking HIGH/CRITICAL results: ${count}"
            } >> "${GITHUB_STEP_SUMMARY}"

            if (( count == 0 )); then
              return
            fi

            jq -r '.runs[]?.results[]? | [(.ruleId // "UNKNOWN"), (.message.text // "Blocking vulnerability")] | @tsv' "${file}" |
              while IFS=$'\t' read -r rule message; do
                message="${message//'%'/'%25'}"
                message="${message//$'\r'/'%0D'}"
                message="${message//$'\n'/'%0A'}"
                echo "::error title=Trivy ${surface}: ${rule}::${message}"
              done
          }

          report_sarif goreevault-trivy-repository.sarif repository
          report_sarif goreevault-trivy-image.sarif image

      - name: Enforce HIGH and CRITICAL vulnerability gates
        if: always()
        env:
          REPOSITORY_SCAN_OUTCOME: ${{ steps.trivy_repo.outcome }}
          IMAGE_SCAN_OUTCOME: ${{ steps.trivy_image.outcome }}
        run: |
          failed=0

          if [[ "${REPOSITORY_SCAN_OUTCOME}" == "failure" ]]; then
            echo '::error title=Trivy repository gate::Repository scan found a fixed HIGH/CRITICAL vulnerability or the scan failed.'
            failed=1
          elif [[ "${REPOSITORY_SCAN_OUTCOME}" != "success" ]]; then
            echo "::error title=Trivy repository gate::Unexpected repository scan outcome: ${REPOSITORY_SCAN_OUTCOME}"
            failed=1
          fi

          if [[ "${IMAGE_SCAN_OUTCOME}" == "failure" ]]; then
            echo '::error title=Trivy image gate::Built-image scan found a fixed HIGH/CRITICAL vulnerability or the scan failed.'
            failed=1
          elif [[ "${IMAGE_SCAN_OUTCOME}" != "success" ]]; then
            echo "::error title=Trivy image gate::Unexpected built-image scan outcome: ${IMAGE_SCAN_OUTCOME}"
            failed=1
          fi

          if (( failed != 0 )); then
            exit 1
          fi

          echo 'Repository and built-image Trivy gates passed.'