name: GoreeVault Recovery

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: goreevault-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Run destructive PostgreSQL and data restore rehearsal
        run: bash scripts/recovery.sh
