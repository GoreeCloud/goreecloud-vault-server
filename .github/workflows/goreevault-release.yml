name: GoreeVault Release

on:
  pull_request:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: goreevault-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-image-preflight:
    name: Validate multi-arch release image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Initialize QEMU binfmt support
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: "arm64"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          cache-binary: false
          driver-opts: |
            network=host

      - name: Build non-publishing multi-arch OCI release candidate
        env:
          PREFLIGHT_VERSION: 0.0.0-ci.${{ github.run_id }}
        run: |
          set -euo pipefail
          OUTPUT_FILE="${RUNNER_TEMP}/goreevault-release-preflight.tar"
          METADATA_FILE="${RUNNER_TEMP}/goreevault-release-preflight-metadata.json"

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file docker/Dockerfile.debian \
            --build-arg DB=postgresql \
            --build-arg "VW_VERSION=${PREFLIGHT_VERSION}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${PREFLIGHT_VERSION}" \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file "${METADATA_FILE}" \
            --output "type=oci,dest=${OUTPUT_FILE}" \
            .

          test -s "${OUTPUT_FILE}"
          tar -tf "${OUTPUT_FILE}" >/dev/null
          DIGEST="$(jq -r '."containerimage.digest" // empty' "${METADATA_FILE}")"
          if [[ ! "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Release preflight did not produce a valid OCI manifest digest." >&2
            cat "${METADATA_FILE}" >&2
            exit 1
          fi
          echo "Validated multi-arch release OCI manifest ${DIGEST}."

  release-controls:
    name: Verify protected release controls
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read

    steps:
      - name: Require protected release environment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! ENVIRONMENT_JSON="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/environments/release")"; then
            echo "The protected GitHub Actions environment 'release' must exist before creating a release tag." >&2
            exit 1
          fi

          REVIEWER_COUNT="$(jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length' <<<"${ENVIRONMENT_JSON}")"
          SELF_REVIEW_BLOCKED="$(jq '[.protection_rules[]? | select(.type == "required_reviewers" and .prevent_self_review == true)] | length' <<<"${ENVIRONMENT_JSON}")"

          if (( REVIEWER_COUNT < 1 )); then
            echo "The 'release' environment must require at least one reviewer." >&2
            exit 1
          fi
          if (( SELF_REVIEW_BLOCKED < 1 )); then
            echo "The 'release' environment must prevent self-review." >&2
            exit 1
          fi

          echo "Protected release environment verified: ${REVIEWER_COUNT} required reviewer(s), self-review disabled."

  release:
    name: Build, attest, and publish GoreeVault
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - release-image-preflight
      - release-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: release
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    env:
      IMAGE: ghcr.io/goreecloud/goreevault-server

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate GoreeVault release tag and source
        id: release_meta
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "${REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Unsupported GoreeVault release tag: ${REF_NAME}" >&2
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Release tag must point to a commit contained in main." >&2
            exit 1
          fi

          VERSION="${REF_NAME#v}"
          BUILD_VERSION="${VERSION%%-rc.*}"
          SHORT_SHA="${GITHUB_SHA:0:12}"
          LATEST_RC=""
          if [[ "${VERSION}" == *-rc.* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          if [[ "${PRERELEASE}" == "false" ]]; then
            git fetch --force --tags origin
            LATEST_RC="$(git tag --list "${REF_NAME}-rc.*" --sort=-version:refname | head -n 1)"
            if [[ -z "${LATEST_RC}" ]]; then
              echo "Stable release ${REF_NAME} requires a prior matching RC tag." >&2
              exit 1
            fi

            RC_COMMIT="$(git rev-list -n 1 "${LATEST_RC}")"
            if [[ "${RC_COMMIT}" != "${GITHUB_SHA}" ]]; then
              echo "Stable release ${REF_NAME} must use the same source commit as latest RC ${LATEST_RC}." >&2
              echo "Stable source: ${GITHUB_SHA}" >&2
              echo "Latest RC source: ${RC_COMMIT}" >&2
              exit 1
            fi
            echo "Stable source matches latest RC ${LATEST_RC} at ${RC_COMMIT}."
          fi

          {
            echo "version=${VERSION}"
            echo "build_version=${BUILD_VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "prerelease=${PRERELEASE}"
            echo "latest_rc=${LATEST_RC}"
          } >> "${GITHUB_OUTPUT}"

      - name: Initialize QEMU binfmt support for RC build
        if: steps.release_meta.outputs.prerelease == 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: "arm64"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          cache-binary: false
          driver-opts: |
            network=host

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build RC or promote exact tested RC manifest
        id: release_image
        env:
          VERSION: ${{ steps.release_meta.outputs.version }}
          BUILD_VERSION: ${{ steps.release_meta.outputs.build_version }}
          SHORT_SHA: ${{ steps.release_meta.outputs.short_sha }}
          PRERELEASE: ${{ steps.release_meta.outputs.prerelease }}
          LATEST_RC: ${{ steps.release_meta.outputs.latest_rc }}
        run: |
          set -euo pipefail

          if [[ "${PRERELEASE}" == "true" ]]; then
            METADATA_FILE="${RUNNER_TEMP}/goreevault-build-metadata.json"
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --file docker/Dockerfile.debian \
              --build-arg DB=postgresql \
              --build-arg "VW_VERSION=${BUILD_VERSION}" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.version=${BUILD_VERSION}" \
              --provenance=mode=max \
              --sbom=true \
              --metadata-file "${METADATA_FILE}" \
              --push \
              --tag "${IMAGE}:${VERSION}" \
              --tag "${IMAGE}:sha-${SHORT_SHA}" \
              .

            DIGEST="$(jq -r '."containerimage.digest" // empty' "${METADATA_FILE}")"
            if [[ ! "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "Unable to determine pushed RC image digest." >&2
              cat "${METADATA_FILE}" >&2
              exit 1
            fi
            echo "Published RC manifest ${IMAGE}@${DIGEST}."
          else
            if [[ -z "${LATEST_RC}" ]]; then
              echo "Stable promotion is missing the validated latest RC tag." >&2
              exit 1
            fi

            RC_VERSION="${LATEST_RC#v}"
            RC_REF="${IMAGE}:${RC_VERSION}"
            RC_DIGEST="$(docker buildx imagetools inspect "${RC_REF}" --format '{{json .Manifest}}' | jq -r '.digest // empty')"
            if [[ ! "${RC_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "Unable to determine latest RC manifest digest for ${RC_REF}." >&2
              exit 1
            fi

            SHA_DIGEST="$(docker buildx imagetools inspect "${IMAGE}:sha-${SHORT_SHA}" --format '{{json .Manifest}}' | jq -r '.digest // empty')"
            if [[ "${SHA_DIGEST}" != "${RC_DIGEST}" ]]; then
              echo "Source-SHA image does not match latest RC manifest." >&2
              echo "RC digest: ${RC_DIGEST}" >&2
              echo "SHA digest: ${SHA_DIGEST}" >&2
              exit 1
            fi

            STABLE_METADATA="${RUNNER_TEMP}/goreevault-stable-promotion-metadata.json"
            docker buildx imagetools create \
              --tag "${IMAGE}:${VERSION}" \
              --metadata-file "${STABLE_METADATA}" \
              "${IMAGE}@${RC_DIGEST}"
            docker buildx imagetools create \
              --tag "${IMAGE}:latest" \
              "${IMAGE}@${RC_DIGEST}"

            DIGEST="$(jq -r '."containerimage.descriptor".digest // empty' "${STABLE_METADATA}")"
            if [[ "${DIGEST}" != "${RC_DIGEST}" ]]; then
              echo "Stable version tag did not preserve the tested RC manifest digest." >&2
              echo "RC digest: ${RC_DIGEST}" >&2
              echo "Stable digest: ${DIGEST}" >&2
              exit 1
            fi

            for REF in "${IMAGE}:${VERSION}" "${IMAGE}:latest"; do
              PROMOTED_DIGEST="$(docker buildx imagetools inspect "${REF}" --format '{{json .Manifest}}' | jq -r '.digest // empty')"
              if [[ "${PROMOTED_DIGEST}" != "${RC_DIGEST}" ]]; then
                echo "Promoted reference ${REF} does not match tested RC manifest ${RC_DIGEST}." >&2
                exit 1
              fi
            done
            echo "Promoted exact tested RC manifest ${RC_DIGEST} to ${VERSION} and latest without rebuilding."
          fi

          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}"

      - name: Attest GoreeVault container image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.release_image.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release_meta.outputs.version }}
          PRERELEASE: ${{ steps.release_meta.outputs.prerelease }}
          LATEST_RC: ${{ steps.release_meta.outputs.latest_rc }}
          DIGEST: ${{ steps.release_image.outputs.digest }}
        run: |
          set -euo pipefail

          RELEASE_ARGS=(
            "${GITHUB_REF_NAME}"
            --verify-tag
            --generate-notes
            --title "GoreeVault ${VERSION}"
          )
          if [[ "${PRERELEASE}" == "true" ]]; then
            RELEASE_ARGS+=(--prerelease)
          fi

          gh release create "${RELEASE_ARGS[@]}"
          {
            echo "### GoreeVault ${VERSION} published"
            echo
            echo "Container: \`${IMAGE}@${DIGEST}\`"
            echo
            if [[ "${PRERELEASE}" == "true" ]]; then
              echo "RC release: \`latest\` was not changed."
            else
              echo "Stable release: exact tested ${LATEST_RC} manifest promoted to \`${VERSION}\` and \`latest\` without rebuilding."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
