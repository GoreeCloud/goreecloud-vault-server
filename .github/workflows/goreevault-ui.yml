name: GoreeVault Glaze UI

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

concurrency:
  group: goreevault-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  glaze-ui:
    name: Validate Glaze UI conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout GoreeVault
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate admin JavaScript syntax
        run: node --check src/static/scripts/admin.js

      - name: Validate Glaze UI source contract
        run: python3 scripts/validate-glaze-ui.py
