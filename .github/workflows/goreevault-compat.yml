name: GoreeVault Compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: goreevault-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate compatibility harness
        run: |
          python3 -m py_compile tests/compat/compat.py tests/compat/import_export.py
          bash -n scripts/compat.sh
          docker compose -f tests/compat/compose.yaml config --quiet

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Run isolated GoreeVault compatibility harness
        run: bash scripts/compat.sh
