name: Atomic Refresh CAS Compile Fix

on:
  push:
    branches:
      - scratch/cas-prep

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[cas-fix]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout scratch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preserve affected-row count explicitly
        run: python3 scripts/fix-cas-map-result.py

      - name: Format and inspect correction
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          git diff -- src/db/models/device.rs

      - name: Commit corrected CAS source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/db/models/device.rs
          git diff --cached --quiet && { echo 'No CAS correction produced.' >&2; exit 1; }
          git commit -m 'Fix atomic refresh row-count result typing'
          git push origin HEAD:scratch/cas-prep
