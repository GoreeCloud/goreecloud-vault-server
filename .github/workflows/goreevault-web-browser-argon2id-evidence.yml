name: GoreeVault Web Browser Argon2id Evidence

on:
  pull_request:
    paths:
      - 'web-client/scripts/validate_browser_argon2id_evidence.py'
      - 'web-client/scripts/test_validate_browser_argon2id_evidence.py'
      - 'web-client/scripts/serve_argon2id_browser_harness.py'
      - 'web-client/scripts/test_serve_argon2id_browser_harness.py'
      - 'web-client/docs/ARGON2ID-REAL-BROWSER-EVIDENCE.md'
      - 'web-client/docs/ARGON2ID-BROWSER-ORIGIN.md'
      - 'web-client/validation/argon2id-real-browser/**'
      - 'web-client/tests/argon2id-real-browser-harness.test.js'
      - '.github/workflows/goreevault-web-browser-argon2id-evidence.yml'
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'web-client/scripts/validate_browser_argon2id_evidence.py'
      - 'web-client/scripts/test_validate_browser_argon2id_evidence.py'
      - 'web-client/scripts/serve_argon2id_browser_harness.py'
      - 'web-client/scripts/test_serve_argon2id_browser_harness.py'
      - 'web-client/docs/ARGON2ID-REAL-BROWSER-EVIDENCE.md'
      - 'web-client/docs/ARGON2ID-BROWSER-ORIGIN.md'
      - 'web-client/validation/argon2id-real-browser/**'
      - 'web-client/tests/argon2id-real-browser-harness.test.js'
      - '.github/workflows/goreevault-web-browser-argon2id-evidence.yml'

permissions:
  contents: read

concurrency:
  group: goreevault-web-browser-argon2id-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate fail-closed browser evidence tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout GoreeVault
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run browser evidence validator regression tests
        run: python3 web-client/scripts/test_validate_browser_argon2id_evidence.py

      - name: Run browser validation-origin safety tests
        run: python3 web-client/scripts/test_serve_argon2id_browser_harness.py

      - name: Run browser harness safety contract tests
        working-directory: web-client
        run: npm test

      - name: Verify CI cannot manufacture production approval
        run: |
          grep -F 'credentialProcessingApproved") is False' web-client/scripts/validate_browser_argon2id_evidence.py
          grep -F 'productionReleaseApproved") is False' web-client/scripts/validate_browser_argon2id_evidence.py
          grep -F 'stablePromotionApproved") is False' web-client/scripts/validate_browser_argon2id_evidence.py
          grep -F '"realBrowserExecuted",' web-client/scripts/validate_browser_argon2id_evidence.py
          grep -F 'require(execution.get(field) is True' web-client/scripts/validate_browser_argon2id_evidence.py
          grep -F 'providerRegistrationWasExplicit: false' web-client/validation/argon2id-real-browser/runner.js
          grep -F 'accepted: false' web-client/validation/argon2id-real-browser/runner.js
          grep -F 'Validation server may bind only to a loopback address.' web-client/scripts/serve_argon2id_browser_harness.py
          grep -F 'Cache-Control", "no-store, max-age=0"' web-client/scripts/serve_argon2id_browser_harness.py
