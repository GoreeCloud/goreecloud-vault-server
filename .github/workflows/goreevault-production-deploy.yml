name: GoreeVault Production Deployment Validation

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

concurrency:
  group: goreevault-production-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-production-compose:
    name: Validate production Compose invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout GoreeVault
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate production deployment model
        run: bash scripts/validate-production-deployment.sh
