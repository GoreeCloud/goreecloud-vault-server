name: goreevault-production

services:
  data-init:
    image: ${GOREVAULT_IMAGE:?Set GOREVAULT_IMAGE to the approved immutable GoreeVault OCI digest}
    pull_policy: always
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        marker="/data/.goreevault-permissions-$${GOREVAULT_UID}-$${GOREVAULT_GID}"
        if [ ! -e "$${marker}" ]; then
          chown -R "$${GOREVAULT_UID}:$${GOREVAULT_GID}" /data
          touch "$${marker}"
          chown "$${GOREVAULT_UID}:$${GOREVAULT_GID}" "$${marker}"
        fi
        chown "$${GOREVAULT_UID}:$${GOREVAULT_GID}" /data
        chmod 0700 /data
    environment:
      GOREVAULT_UID: ${GOREVAULT_UID:-10001}
      GOREVAULT_GID: ${GOREVAULT_GID:-10001}
    volumes:
      - goreevault-data:/data
    network_mode: none
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true

  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to an immutable PostgreSQL image digest}
    pull_policy: always
    container_name: goreevault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - goreevault-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s
    networks:
      - goreevault-backend

  server:
    image: ${GOREVAULT_IMAGE:?Set GOREVAULT_IMAGE to the approved immutable GoreeVault OCI digest}
    pull_policy: always
    container_name: goreevault-server
    restart: unless-stopped
    init: true
    user: "${GOREVAULT_UID:-10001}:${GOREVAULT_GID:-10001}"
    read_only: true
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1700
    depends_on:
      data-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      DOMAIN: ${GOREVAULT_DOMAIN:?Set GOREVAULT_DOMAIN to the public HTTPS origin}
      DATA_FOLDER: /data
      ROCKET_ADDRESS: 0.0.0.0
      ROCKET_PORT: "8080"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED:-false}
      INVITATIONS_ALLOWED: ${INVITATIONS_ALLOWED:-true}
      ENABLE_WEBSOCKET: "true"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-GoreeVault}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EVENTS_DAYS_RETAIN: ${EVENTS_DAYS_RETAIN:-90}
      TRASH_AUTO_DELETE_DAYS: ${TRASH_AUTO_DELETE_DAYS:-30}
      INCOMPLETE_2FA_TIME_LIMIT: ${INCOMPLETE_2FA_TIME_LIMIT:-3}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - goreevault-data:/data
    ports:
      - "127.0.0.1:${GOREVAULT_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - goreevault-backend
      - goreevault-edge

volumes:
  goreevault-postgres:
  goreevault-data:

networks:
  goreevault-backend:
    internal: true
  goreevault-edge:
