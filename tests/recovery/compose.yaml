name: goreevault-recovery

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: goreevault_recovery
      POSTGRES_USER: goreevault_recovery
      POSTGRES_PASSWORD: goreevault_recovery_0123456789abcdef0123456789abcdef
    volumes:
      - recovery-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goreevault_recovery -d goreevault_recovery"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    stop_grace_period: 30s
    networks:
      - backend

  server:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.debian
      args:
        DB: postgresql
    image: goreevault-server:recovery
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOMAIN: http://127.0.0.1:18081
      DATABASE_URL: postgresql://goreevault_recovery:goreevault_recovery_0123456789abcdef0123456789abcdef@postgres:5432/goreevault_recovery
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED:-true}
      INVITATIONS_ALLOWED: "false"
      WEB_VAULT_ENABLED: "false"
      ENABLE_WEBSOCKET: "false"
      LOG_LEVEL: warn
      JOB_POLL_INTERVAL_MS: "0"
      ADMIN_TOKEN: ""
    volumes:
      - recovery-data:/data
    ports:
      - "127.0.0.1:18081:80"
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - backend
      - edge

volumes:
  recovery-postgres:
  recovery-data:

networks:
  backend:
    internal: true
  edge:
